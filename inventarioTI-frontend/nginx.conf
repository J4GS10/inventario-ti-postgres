# =========================================================================
# Nginx config para SPA + proxy al backend.
# =========================================================================

# Pool de upstream del backend.
# `resolve` + resolver de Docker: nginx vuelve a resolver `backend` cada 10 s.
# Sin esto, la IP se fija al arrancar nginx y, cuando el contenedor del
# backend se recrea (cada despliegue), cambia de IP → 502 en todo el sistema
# hasta reiniciar nginx. Requiere nginx >= 1.27.3.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

upstream backend_api {
    zone backend_api 64k;
    server backend:8000 resolve;
    keepalive 16;
}

# Mapa de security headers (se incluye en cada location)
# IMPORTANTE en nginx: si una `location` declara `add_header`, NO hereda
# los del bloque `server`. Por eso encapsulamos los security headers en
# una variable común vía `map` + `include` no es trivial; replicarlos
# explícitamente por bloque es lo más legible.

server {
    listen 80;
    server_name _;

    server_tokens off;
    client_max_body_size 20M;

    # =========================================================
    # GZIP
    # =========================================================
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/xml
        application/json application/javascript application/xml+rss
        application/atom+xml image/svg+xml;

    # =========================================================
    # HEALTH (frontend)
    # =========================================================
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # =========================================================
    # API PROXY al backend (mismo origen → sin CORS)
    # =========================================================
    location /api/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(self), payment=()" always;

        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # SECURITY — cadena de IP en este stack:
        #   cliente real → Caddy (edge) → nginx → backend
        # Caddy SOBREESCRIBE X-Real-IP con {remote_host} (= IP real del cliente,
        # nunca el header que el cliente envió). Por eso aquí PRESERVAMOS lo
        # que Caddy puso — usar $remote_addr aquí pondría la IP de Caddy y
        # romperia el rate-limit por-cliente.
        proxy_set_header X-Real-IP $http_x_real_ip;
        # X-Forwarded-For: NO usar $proxy_add_x_forwarded_for (anexa lo que el
        # cliente envíe → permite spoofing del leftmost IP). Caddy ya envía la
        # IP real del cliente vía X-Real-IP; aquí sobreescribimos XFF con
        # $remote_addr (la IP de Caddy) para evitar inyección.
        proxy_set_header X-Forwarded-For $remote_addr;
        # El TLS termina en Caddy: $scheme aquí sería siempre "http". Se
        # propaga el esquema original que envía Caddy.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Sincronización con Active Directory: con miles de cuentas puede superar
    # los 60 s estándar. Mismos headers que /api/.
    location = /api/v1/directorio/sincronizar {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 300s;
        proxy_send_timeout 60s;
    }

    # Health del backend (debug)
    location = /health {
        proxy_pass http://backend_api/health;
        proxy_set_header Host $host;
    }

    # Health extendido (DB + Redis) — usar para sondas detalladas.
    location = /health/full {
        proxy_pass http://backend_api/health/full;
        proxy_set_header Host $host;
    }

    # Métricas Prometheus-style.
    # NOTA DE SEGURIDAD: este `allow 172.16.0.0/12` cubre la red Docker
    # interna, así que Caddy (peer del nginx) es siempre "interno" y por
    # tanto cualquier petición externa que pase por Caddy llega aquí
    # autorizada. Para restricción real, autentica delante en Caddy con
    # basic_auth o `@private` matcher por IP de origen. En este stack la
    # info expuesta (3 gauges) NO contiene secretos ni PII, sólo conteos.
    location = /metrics {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;
        access_log off;
        proxy_pass http://backend_api/metrics;
        proxy_set_header Host $host;
    }

    # =========================================================
    # ASSETS estáticos con hash → cache inmutable de 1 año.
    # =========================================================
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|ico|png|jpg|jpeg|gif|svg|webp|avif|map)$ {
        # Security headers (replicados — locations no heredan add_header)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(self), payment=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    # =========================================================
    # SPA fallback: HTML siempre fresco.
    # =========================================================
    location / {
        # Security headers completos para HTML
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(self), payment=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        # HSTS: descomenta cuando sirvas por HTTPS (detrás de un proxy TLS).
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        # CSP: permitimos imágenes externas vía HTTPS (logos de empresa).
        # Mantenemos scripts/styles estrictos: solo 'self' (CSP previene XSS).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self';" always;

        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
